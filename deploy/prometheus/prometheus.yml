global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: mobile_home
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['exporter:9188']
        labels:
          instance: smart-plugs
